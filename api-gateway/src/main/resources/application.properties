spring.application.name=api-gateway
server.port=8082
server.forward-headers-strategy=framework
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.cloud.gateway.server.webflux.routes[0].id=relatos
spring.cloud.gateway.server.webflux.routes[0].uri=lb://relatos-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/relatos,/api/v1/relatos/{id}
spring.cloud.gateway.server.webflux.routes[1].id=atendimentos
spring.cloud.gateway.server.webflux.routes[1].uri=lb://atendimentos-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/atendimentos,/api/v1/atendimentos/{id}
spring.cloud.gateway.server.webflux.routes[2].id=swagger-relatos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://relatos-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/relatos/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[3].id=swagger-atendimentos
spring.cloud.gateway.server.webflux.routes[3].uri=lb://atendimentos-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/atendimentos/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
springdoc.swagger-ui.urls[0].name=Relatos
springdoc.swagger-ui.urls[0].url=/relatos/v3/api-docs
springdoc.swagger-ui.urls[1].name=Atendimentos
springdoc.swagger-ui.urls[1].url=/atendimentos/v3/api-docs
