spring.application.name=atendimentos-service
server.port=0
server.forward-headers-strategy=framework
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/atendimentos}
spring.datasource.username=${DB_USER:bairro}
spring.datasource.password=${DB_PASSWORD:bairro_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
springdoc.paths-to-match=/api/v1/atendimentos,/api/v1/atendimentos/**
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.relatos-service.connect-timeout=2000
spring.cloud.openfeign.client.config.relatos-service.read-timeout=3000
