services:
  mysql-relatos:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: relatos
      MYSQL_USER: bairro
      MYSQL_PASSWORD: bairro_local
      MYSQL_ROOT_PASSWORD: root_local
    ports: ["127.0.0.1:3307:3306"]
    volumes: [relatos_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u bairro -p$$MYSQL_PASSWORD relatos -e 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 30
  mysql-atendimentos:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: atendimentos
      MYSQL_USER: bairro
      MYSQL_PASSWORD: bairro_local
      MYSQL_ROOT_PASSWORD: root_local
    ports: ["127.0.0.1:3308:3306"]
    volumes: [atendimentos_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u bairro -p$$MYSQL_PASSWORD atendimentos -e 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 30
volumes:
  relatos_data:
  atendimentos_data:
